name: CI

on:
  push:
    branches: [ main, CarRental-Portal,20261021-portal-Tests-e2e ]
  pull_request:
    branches: [ main, CarRental-Portal,20261021-portal-Tests-e2e ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
      ASPNETCORE_ENVIRONMENT: Testing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test Tests/Portal.Tests --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Run integration tests
      env:
        ASPNETCORE_ENVIRONMENT: Testing
      run: dotnet test Tests/Portal.Test.Integration --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Run E2E tests
      env:
        ASPNETCORE_ENVIRONMENT: Testing
        DOTNET_CLI_MAX_PARALLEL_TESTS: 1
      run: dotnet test Tests/Portal.Test.E2E --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Upload coverage reports
      if: always() && hashFiles('**/coverage.cobertura.xml') != ''
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN || '' }}

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
